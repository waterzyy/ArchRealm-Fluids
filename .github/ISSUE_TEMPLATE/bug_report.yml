name: Bug report
description: Сообщить об ошибке в ArchRealm Fluids
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт! Пожалуйста, заполните поля ниже — так ошибку будет проще воспроизвести.
  - type: input
    id: mod-version
    attributes:
      label: Версия мода
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      description: Версия Minecraft, Fabric Loader, Fabric API, Java, тип игры (одиночная/сервер)
      placeholder: "26.3, Loader 0.20.1, Fabric API 0.165.0+26.3, Java 25, одиночная игра"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      placeholder: |
        1. Поставить два блока «Реальный источник воды» на разных уровнях
        2. Соединить их траншеей
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи и скриншоты
      description: Вставьте содержимое `logs/latest.log` или приложите скриншоты
      render: text
  - type: input
    id: config
    attributes:
      label: Изменённые настройки
      description: Если правили `config/archrealm_fluids.json`, укажите, что именно
